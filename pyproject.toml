
[project]
name = "ragforge-toolkit"
version = "0.1.1"
description = "A simple and extensible Python framework for building GenAI applications."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.14.3",
    "pymupdf>=2.1",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
gemini = ["google-generativeai>=0.8.0"]
groq = ["groq>=0.9.0"]
ollama = ["ollama>=0.3.0"]
local = ["sentence-transformers>=3.0.0"]
sentence-transformers = ["sentence-transformers>=3.0.0"]
chroma = ["chromadb>=0.5.0"]
faiss = ["faiss-cpu>=1.8.0"]
all = [
    "openai>=1.0.0",
    "google-generativeai>=0.8.0",
    "groq>=0.9.0",
    "ollama>=0.3.0",
    "sentence-transformers>=3.0.0",
    "chromadb>=0.5.0",
    "faiss-cpu>=1.8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
    "hatchling>=1.27",
    "twine>=7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gen_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
